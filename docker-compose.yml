services:
  postgres:
    image: postgres:16-alpine
    container_name: peer-review-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: peerreview
      POSTGRES_PASSWORD: peerreview
      POSTGRES_DB: peerreview
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peerreview -d peerreview"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
