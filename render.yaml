# Render Blueprint for Peer Review v2
# https://render.com/docs/blueprint-spec
#
# Deploys the NestJS API plus a managed Postgres instance. The web app is not
# included — deploy it separately as a Static Site (see README) once you know
# the API's public URL.

services:
  - type: web
    name: peer-review-api
    runtime: node
    plan: free
    region: oregon
    healthCheckPath: /api/health

    # Render's node runtime ships Node, not Bun, so Bun is installed first and
    # put on PATH for the rest of the build. Only the BUILD needs Bun — the
    # start command is plain Node, so the runtime image stays vanilla.
    #
    # Steps: install deps -> build @repo/api and everything it depends on
    # (turbo pulls in @repo/types and @repo/db, and @repo/db's build runs
    # `prisma generate`) -> create the schema -> seed the demo data.
    buildCommand: >-
      curl -fsSL https://bun.sh/install | bash &&
      export PATH="$HOME/.bun/bin:$PATH" &&
      bun install --frozen-lockfile &&
      bunx turbo run build --filter=@repo/api &&
      bun run --cwd packages/db push &&
      bun run --cwd packages/db seed

    startCommand: node apps/api/dist/main.js

    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production

      # Selects the Postgres datasource header in packages/db/scripts/build-schema.mjs.
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: DATABASE_URL
        fromDatabase:
          name: peer-review-db
          property: connectionString

      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d

      # PORT is injected by Render and is what main.ts binds to. Do not set it.
      #
      # CORS_ORIGIN: "*" reflects any origin. Replace it with your deployed web
      # app's URL once that exists — a public API that accepts every origin is
      # fine for a demo and wrong for anything real.
      - key: CORS_ORIGIN
        value: "*"

databases:
  # HEADS UP: a free Render Postgres instance is DELETED 30 days after it is
  # created (plus a 14-day grace period to upgrade). Capped at 1 GB, and only
  # one free database is allowed per workspace.
  #
  # To outlive that, move to a provider whose free tier is permanent (Neon,
  # for example): delete this whole `databases:` block, change the DATABASE_URL
  # entry above from `fromDatabase:` to `sync: false`, and paste the external
  # connection string into the Render dashboard. Nothing in the app changes —
  # DATABASE_PROVIDER is already postgresql.
  - name: peer-review-db
    plan: free
    databaseName: peerreview
    user: peerreview
